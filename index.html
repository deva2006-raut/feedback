<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Feedback System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container" id="login-form">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p><a href="#" id="show-signup">Sign Up</a> | <a href="#" id="show-forgot">Forgot Password</a></p>
        </div>

        <div class="form-container hidden" id="signup-form">
            <h2>Sign Up</h2>
            <form id="signupForm">
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <p><a href="#" id="show-login">Back to Login</a></p>
        </div>

        <div class="form-container hidden" id="forgot-form">
            <h2>Forgot Password</h2>
            <form id="forgotForm">
                <input type="email" id="forgot-email" placeholder="Enter your email" required>
                <button type="submit">Reset Password</button>
            </form>
            <p><a href="#" id="back-to-login">Back to Login</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
